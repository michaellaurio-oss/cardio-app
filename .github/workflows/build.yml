# Builds the app on every push to main, so a change that doesn't compile shows up right away
# (a red X on the commit) instead of on Michael's PC. Publishes nothing; release.yml does releases.
name: Build check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
